<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Banded</title>
    <meta name="description" content="The page you're looking for doesn't exist on banded.uk.">
    <meta name="robots" content="noindex">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #080810;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            text-align: center;
        }

        .wordmark {
            font-size: 96px;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #8B9DC3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .tagline {
            font-size: 20px;
            color: #8B9DC3;
            max-width: 460px;
            margin-bottom: 36px;
            line-height: 1.5;
            text-wrap: balance;
        }

        .cta {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            background: #3B82F6;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .cta:hover { background: #2563EB; }

        footer {
            padding: 24px;
            text-align: center;
            border-top: 1px solid rgba(139, 157, 195, 0.1);
            font-size: 14px;
            color: #8B9DC3;
        }

        footer a {
            color: #8B9DC3;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover { color: #FFFFFF; }

        .footer-links { margin-bottom: 12px; }

        .footer-links a + a::before {
            content: ' \00B7 ';
            margin: 0 8px;
        }

        @media (max-width: 480px) {
            .wordmark { font-size: 72px; }
            .tagline { font-size: 17px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="wordmark">404</div>
        <p class="tagline">This page doesn't exist on banded.uk. It may have moved, or you may have followed a broken link.</p>
        <a class="cta" href="/">Back to Banded</a>
    </main>
    <footer>
        <div class="footer-links">
            <a href="/privacy">Privacy</a>
            <a href="/terms">Terms</a>
            <a href="/data">Data</a>
            <a href="/support">Support</a>
            <a href="mailto:hello@banded.uk">hello@banded.uk</a>
        </div>
        <p>&copy; 2026 Banded</p>
    </footer>
</body>
</html>
