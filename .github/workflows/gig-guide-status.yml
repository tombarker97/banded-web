# Daily Ticketmaster status check for the banded.uk gig guide.
#
# For every data/gig-guide/*.json week that hasn't ended, looks up each gig's
# tmEventId and updates only its status / newDate / newStartTime, so cancelled,
# postponed, rescheduled and off-sale gigs are corrected on the page. Pushing to
# main triggers the Cloudflare Pages rebuild.
#
# Needs the repo secret TICKETMASTER_API_KEY (Discovery API consumer key).

name: Gig guide status

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gig-guide-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Node 24 runs the .ts scripts directly; they only use Node built-ins.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh statuses from Ticketmaster
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/update-gig-status.ts

      # Runs even if a Ticketmaster batch failed, so the batches that worked
      # still get published. Only changed week files are staged.
      - name: Validate, commit and push changes
        if: ${{ !cancelled() }}
        run: |
          changed=$(git diff --name-only -- 'data/gig-guide/*.json')
          if [ -z "$changed" ]; then
            echo "No status changes."
            exit 0
          fi
          node scripts/check-gig-guide.ts $changed
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          git commit -m "Gig guide: status update $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
